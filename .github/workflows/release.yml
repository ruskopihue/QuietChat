# Push a tag like v1.0 to publish a release. The tag must match "## Version:" in QuietChat.toc.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches QuietChat.toc
        run: |
          version=$(sed -n 's/^## Version: *//p' QuietChat.toc | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in QuietChat.toc"
            exit 1
          fi
      - run: ./package.sh
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/QuietChat-*.zip --title "QuietChat ${GITHUB_REF_NAME#v}" --generate-notes
