# Python is only used for the tests; none of it ships with the addon.
[project]
name = "quietchat"
version = "0" # unused: the addon's version is in QuietChat.toc
requires-python = ">=3.12"

[dependency-groups]
dev = [
	"lupa>=2.8",
	"pytest>=9.1",
	"ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# The formatter handles line length; what it leaves long is Lua code inside strings
ignore = ["E501"]
